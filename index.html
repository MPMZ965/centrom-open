<h1>CENTROM</h1>

<p><strong>Da origem da vida ao futuro da humanidade</strong></p>

<hr>

<p>Quando as palavras sulcam o campo, surge vida.</p>

<hr>

<p>O conhecimento não pertence a ninguém.<br>
Circula.<br>
Transforma.<br>
Regenera.</p>

<p>CENTROM nasce desse princípio.</p>

<p>O centro não é geográfico.<br>
É consciência aplicada.</p>
